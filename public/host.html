<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종강파티 투표 · 진행자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<script src="/qrcode.js"></script>
<style>
  body { font-size: 18px; }
  header { display: flex; align-items: center; gap: 1em; padding: .6em 1.2em; background: rgba(0,0,0,.2); }
  header .join { display: flex; align-items: center; gap: .7em; }
  header .join b { font-size: 1.2em; letter-spacing: .02em; }
  #smallqr { background: #fff; padding: 4px; border-radius: 6px; line-height: 0; }
  header .spacer { flex: 1; }
  header .pill { background: rgba(255,255,255,.15); padding: .3em .8em; border-radius: 99px; font-weight: 700; }
  main { padding: 1.5em 3vw 7em; max-width: 1400px; margin: 0 auto; }
  .qhead { display: flex; gap: .6em; align-items: center; justify-content: center; }
  .qnum { background: #fff; color: #0b3d2e; font-weight: 900; padding: .2em .7em; border-radius: 99px; }
  .qtype { background: rgba(255,255,255,.18); padding: .2em .7em; border-radius: 99px; font-weight: 700; }
  .qtitle { text-align: center; font-size: clamp(2rem, 4.6vw, 4rem); line-height: 1.2; margin: .4em 0 .6em; word-break: keep-all; }
  .qtitle.small { font-size: clamp(1.5rem, 2.8vw, 2.4rem); margin-bottom: .8em; }
  .openinfo { display: flex; justify-content: center; align-items: center; gap: 4em; margin: 1.5em 0; }
  .timer { width: 9rem; height: 9rem; border-radius: 50%; background: #fff; color: #0b3d2e; display: grid; place-items: center; font-size: 3.4rem; font-weight: 900; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .timer.warn { background: #e63946; color: #fff; animation: pulse 1s infinite; }
  .timer.manual { font-size: 1.3rem; }
  .answered { text-align: center; }
  .answered b { display: block; font-size: 4.5rem; line-height: 1; }
  .opts { display: flex; flex-wrap: wrap; gap: .6em; justify-content: center; max-width: 1100px; margin: 0 auto; }
  .opts span { color: #0b3d2e; padding: .6em 1.1em; border-radius: 12px; font-weight: 800; font-size: 1.3em; }
  .opts.many span { font-size: 1em; padding: .4em .8em; }
  .hint { text-align: center; font-size: 1.4em; opacity: .9; }
  .controls { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; gap: .8em; justify-content: center; padding: 1em; background: linear-gradient(transparent, rgba(0,0,0,.35)); }
  .results { background: rgba(0,0,0,.18); border-radius: 20px; padding: 1.5em 2em; font-size: 1.25em; }
  .lobby { text-align: center; }
  .lobby h1 { font-size: clamp(2.4rem, 5vw, 4.2rem); margin: .3em 0; }
  .join-box { display: inline-flex; gap: 2.5em; align-items: center; background: rgba(0,0,0,.2); padding: 1.5em 2.5em; border-radius: 24px; text-align: left; }
  #bigqr { background: #fff; padding: 12px; border-radius: 14px; line-height: 0; }
  .join-url { font-size: clamp(1.6rem, 3vw, 2.6rem); font-weight: 900; background: #fff; color: #0b3d2e; padding: .2em .6em; border-radius: 12px; display: inline-block; margin: .3em 0; word-break: break-all; }
  .count b { font-size: 2em; }
  .chips { display: flex; flex-wrap: wrap; gap: .5em; justify-content: center; margin: 1.5em auto; max-width: 1100px; }
  .chips span { background: #fff; color: #0b3d2e; font-weight: 800; padding: .35em .9em; border-radius: 99px; animation: pop .3s; }
  .endscreen { text-align: center; padding-top: 12vh; }
  .endscreen h1 { font-size: clamp(2.6rem, 6vw, 5rem); }

  /* 메뉴 */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #fff; color: #222; z-index: 50; transform: translateX(100%); transition: transform .25s; overflow-y: auto; padding: 1.2em 1.4em 3em; font-size: 16px; box-shadow: -10px 0 30px rgba(0,0,0,.3); }
  #drawer.open { transform: none; }
  #drawer h2 { margin: 1.2em 0 .5em; font-size: 1.15em; }
  #drawer .close-x { position: absolute; top: .8em; right: 1em; background: #eee; border-radius: 99px; width: 2em; height: 2em; }
  .qlist { list-style: none; padding: 0; margin: 0; }
  .qlist li { display: flex; align-items: center; gap: .5em; padding: .45em 0; border-bottom: 1px solid #eee; }
  .qlist li.cur { background: #e8f5ee; }
  .qlist .t { flex: 1; min-width: 0; }
  .qlist .t small { color: #c1121f; font-weight: 700; margin-right: .3em; }
  .qlist button { background: #d8f0e2; color: #0b3d2e; border-radius: 8px; padding: .3em .6em; font-weight: 700; font-size: .9em; }
  #drawer textarea { width: 100%; border: 1px solid #ccc; border-radius: 10px; padding: .6em; font-size: 14px; line-height: 1.5; }
  #drawer label { display: block; margin: .4em 0; }
  #drawer input[type=number] { width: 5em; padding: .3em; border: 1px solid #ccc; border-radius: 8px; }
  #drawer input[type=text] { width: 100%; padding: .5em; border: 1px solid #ccc; border-radius: 8px; }
  #drawer .help { color: #666; font-size: .9em; line-height: 1.5; background: #f6f6f6; padding: .6em .8em; border-radius: 8px; }
  #drawer .row { display: flex; gap: .5em; flex-wrap: wrap; margin-top: .6em; }
  #drawer .btn { box-shadow: none; border: 1px solid #ddd; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; place-items: center; z-index: 60; padding: 4vw; cursor: zoom-out; }
  #zoom.show { display: grid; }
  #zoom div { background: #fff59d; color: #222; font-size: clamp(1.6rem, 3.6vw, 3.2rem); padding: 1.2em 1.4em; border-radius: 10px; max-width: 1100px; white-space: pre-wrap; word-break: break-word; line-height: 1.45; animation: pop .25s; }
  #keybox { max-width: 380px; margin: 20vh auto; text-align: center; }
  #keybox input { width: 100%; font-size: 1.5em; padding: .5em; border-radius: 12px; border: 0; text-align: center; margin: 1em 0; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
</style>
</head>
<body>
<div id="conn">서버와 연결이 끊겼어요. 다시 연결하는 중…</div>
<div id="app"></div>
<div id="drawer"></div>
<div id="zoom"><div></div></div>
<script src="/common.js"></script>
<script>
const params = new URLSearchParams(location.search);
let key = params.get('key') || localStorage.getItem('hostKey') || '';
let S = null, offset = 0, stageKey = '', qrUrl = '';

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function api(action, extra = {}) {
  const r = await fetch('/api/host', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, action, ...extra }) });
  const j = await r.json();
  if (j.error) { toast(j.error); throw new Error(j.error); }
  return j;
}

function askKey(msg) {
  document.getElementById('app').innerHTML = `<div id="keybox"><h1>🔑 진행자 입장</h1>
    <p>${msg || '서버를 켠 창에 나온 호스트 비밀번호를 입력하세요'}</p>
    <input id="keyin" inputmode="numeric" autofocus><button class="btn primary big" id="keygo">입장</button></div>`;
  const go = () => { key = document.getElementById('keyin').value.trim(); start(); };
  document.getElementById('keygo').onclick = go;
  document.getElementById('keyin').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function start() {
  if (!key) return askKey();
  try { await api('ping'); } catch { return askKey('비밀번호가 틀렸어요. 다시 입력해 주세요'); }
  localStorage.setItem('hostKey', key);
  if (params.has('key')) history.replaceState(null, '', '/host');
  makeSSE('/events?role=host&key=' + encodeURIComponent(key), d => { S = d; offset = d.now - Date.now(); render(); });
}

function joinUrl() {
  const custom = localStorage.getItem('joinUrl');
  if (custom) return custom;
  if (S && S.publicUrl) return S.publicUrl;
  const local = ['localhost', '127.0.0.1', '::1', '[::1]'].includes(location.hostname);
  if (local && S && S.lanUrls.length) return S.lanUrls[0];
  return location.origin;
}
function qr(el, url, size) {
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const cell = Math.max(1, Math.floor(size / q.getModuleCount()));
  el.innerHTML = q.createSvgTag({ cellSize: cell, margin: 0 });
}

function nextIndex() {
  if (S.cur < 0) return 0;
  return S.cur + 1 < S.total ? S.cur + 1 : -1;
}

function render() {
  const app = document.getElementById('app');
  if (!document.getElementById('hdr')) {
    app.innerHTML = `<header id="hdr"><div class="join"><div id="smallqr"></div><div>참여 주소<br><b id="hurl"></b></div></div>
      <div class="spacer"></div><span class="pill">👥 <span id="hon"></span>명</span><span class="pill" id="hprog"></span>
      <button class="btn ghost" id="menuBtn">☰ 질문 목록 · 설정</button></header><main id="stage"></main><div class="controls" id="controls"></div>`;
    document.getElementById('menuBtn').onclick = openDrawer;
  }
  const url = joinUrl();
  if (url !== qrUrl) { qrUrl = url; qr(document.getElementById('smallqr'), url, 64); stageKey = ''; }
  document.getElementById('hurl').textContent = url.replace(/^https?:\/\//, '');
  document.getElementById('hon').textContent = S.online;
  document.getElementById('hprog').textContent = S.cur >= 0 ? `${S.cur + 1} / ${S.total}` : `질문 ${S.total}개`;
  document.getElementById('smallqr').parentElement.style.visibility = S.phase === 'lobby' ? 'hidden' : 'visible';

  const k = [S.phase, S.cur, S.q && S.q.title, S.phase === 'results' ? JSON.stringify(S.results) : ''].join('|');
  if (k !== stageKey) { stageKey = k; buildStage(); }
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('ansN', S.answered); set('onN', S.online); set('onlineN', S.online);
  const chips = document.getElementById('chips');
  if (chips) chips.innerHTML = S.players.map(n => `<span>${esc(n)}</span>`).join('');
  tick();
  if (document.getElementById('drawer').classList.contains('open')) refreshQList();
}

function buildStage() {
  const st = document.getElementById('stage'), ctl = document.getElementById('controls');
  const q = S.q, n = nextIndex();
  const head = q ? `<div class="qhead"><span class="qnum">Q${S.cur + 1}</span><span class="qtype">${TYPE_LABEL[q.type]}</span></div>` : '';
  if (S.phase === 'lobby') {
    const url = joinUrl();
    st.innerHTML = `<div class="lobby"><h1>🎄 종강파티 투표 🎅</h1>
      <div class="join-box"><div id="bigqr"></div><div><div style="font-size:1.3em">휴대폰 카메라로 QR을 찍거나<br>이 주소로 들어오세요</div>
      <div class="join-url">${esc(url.replace(/^https?:\/\//, ''))}</div>
      <div class="count"><b id="onlineN">${S.online}</b>명 참여 중</div></div></div>
      <div class="chips" id="chips"></div></div>`;
    qr(document.getElementById('bigqr'), url, 260);
    ctl.innerHTML = n >= 0
      ? `<button class="btn primary big" data-primary onclick="api('start',{i:${n}})">${S.cur < 0 ? '첫 질문 시작' : `${n + 1}번 질문 시작`} ▶</button>`
      : `<button class="btn primary big" data-primary onclick="api('end')">끝내기 🎊</button>`;
  } else if (S.phase === 'open') {
    let body = '';
    if (q.type === 'choice') body = `<div class="opts${q.options.length > 8 ? ' many' : ''}">${q.options.map((o, i) => `<span style="background:${COLORS[i % COLORS.length]}">${esc(o)}</span>`).join('')}</div>`;
    else if (q.type === 'person') body = `<div class="hint">👆 휴대폰에서 동기 이름을 골라 주세요</div>`;
    else if (q.type === 'number') body = `<div class="hint">🔢 숫자로 답해 주세요</div>`;
    else if (q.type === 'short') body = `<div class="hint">✍️ 짧게 적어 주세요 (같은 답끼리 모아서 보여드려요)</div>`;
    else body = `<div class="hint">💌 익명으로 메시지를 남겨 주세요</div>`;
    st.innerHTML = `${head}<h1 class="qtitle">${esc(q.title)}</h1>
      <div class="openinfo"><div class="timer" id="timer"></div><div class="answered"><b id="ansN">${S.answered}</b>/ <span id="onN">${S.online}</span>명 응답</div></div>${body}`;
    ctl.innerHTML = `<button class="btn ghost" onclick="api('extend')">+15초</button>
      <button class="btn primary big" data-primary onclick="api('close')">마감하고 결과 보기 ▶</button>`;
  } else if (S.phase === 'results') {
    st.innerHTML = `${head}<h1 class="qtitle small">${esc(q.title)}</h1><div class="results">${renderResults(S.results, 'host')}</div>`;
    ctl.innerHTML = `${S.cur > 0 ? `<button class="btn ghost" onclick="api('show',{i:${S.cur - 1}})">◀ 이전 결과</button>` : ''}
      <button class="btn ghost" onclick="if(confirm('이 질문의 답을 지우고 다시 받을까요?')) api('start',{i:${S.cur}})">↻ 다시 받기</button>
      ${n >= 0 ? `<button class="btn primary big" data-primary onclick="api('start',{i:${n}})">다음 질문 ▶</button>`
               : `<button class="btn primary big" data-primary onclick="api('end')">끝내기 🎊</button>`}`;
  } else {
    st.innerHTML = `<div class="endscreen"><h1>🎊 수고하셨습니다! 🎊</h1><p style="font-size:1.6em">모두 즐거운 방학 보내세요 ☀️</p></div>`;
    ctl.innerHTML = `<button class="btn ghost" onclick="api('lobby')">대기 화면으로</button>`;
  }
}

function tick() {
  const el = document.getElementById('timer');
  if (!el || !S || S.phase !== 'open') return;
  if (!S.endsAt) { el.textContent = '시간제한 없음'; el.className = 'timer manual'; return; }
  const left = Math.max(0, Math.ceil((S.endsAt - (Date.now() + offset)) / 1000));
  el.textContent = left; el.className = 'timer' + (left <= 5 ? ' warn' : '');
}
setInterval(tick, 250);

// 메모지 크게 보기
document.addEventListener('click', e => {
  const c = e.target.closest('.card');
  const z = document.getElementById('zoom');
  if (c) { z.firstElementChild.textContent = c.textContent; z.firstElementChild.style.background = c.style.background; z.classList.add('show'); }
  else if (e.target.closest('#zoom')) z.classList.remove('show');
});
// 오른쪽 화살표 / 엔터 = 다음 진행
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, button')) return;
  if (document.getElementById('drawer').classList.contains('open')) return;
  if (e.key === 'Escape') document.getElementById('zoom').classList.remove('show');
  if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') {
    const b = document.querySelector('[data-primary]'); if (b) { e.preventDefault(); b.click(); }
  }
});

// ---------- 질문 목록 · 설정 ----------
function openDrawer() {
  const d = document.getElementById('drawer');
  d.innerHTML = `<button class="close-x" onclick="closeDrawer()">✕</button>
    <h2 style="margin-top:0">질문 목록</h2><ul class="qlist" id="qlist"></ul>
    <h2>동기 명단 (${S.rosterCount}명)</h2>
    <div class="help">한 줄에 한 명씩, 또는 쉼표로 구분해서 적어 주세요. ‘동기’ 질문에서 이 명단이 보기로 나와요. 비워 두면 ‘동기’ 질문은 이름을 직접 적는 주관식이 돼요.</div>
    <textarea id="rosterIn" rows="8">${esc(S.rosterText)}</textarea>
    <h2>질문 편집</h2>
    <div class="help">한 줄에 질문 하나: <b>종류 | 질문 | 보기1, 보기2, …</b><br>
      종류: <b>객관식</b>(보기 개수 제한 없음) · <b>동기</b>(명단에서 고르기) · <b>숫자</b> · <b>단답</b>(짧은 주관식, 같은 답끼리 집계 + 워드클라우드) · <b>메시지</b>(긴 글, 익명 메모지로 공개)<br>
      예) <code>객관식 | 실습조 선호도 | 가나다, 칼리지, 랜덤, 학번</code><br>맨 끝에 <code>| 5분</code>처럼 붙이면 그 질문만 제한시간이 따로 적용돼요. #으로 시작하는 줄은 무시돼요.</div>
    <textarea id="qIn" rows="14">${esc(S.questionsText)}</textarea>
    <h2>진행 설정</h2>
    <label>객관식·동기·숫자 제한시간 <input type="number" id="t1" min="0" max="600" value="${S.settings.timeChoice}"> 초</label>
    <label>단답·메시지 제한시간 <input type="number" id="t2" min="0" max="600" value="${S.settings.timeText}"> 초</label>
    <div class="help">0초로 하면 시간제한 없이 ‘마감’ 버튼을 누를 때까지 받아요.</div>
    <label><input type="checkbox" id="auto" ${S.settings.autoClose ? 'checked' : ''}> 접속한 모두가 답하면 자동으로 마감</label>
    <div class="row"><button class="btn primary" onclick="saveConfig()">저장</button></div>
    <h2>참여 주소</h2>
    <div class="help">QR에 넣을 주소예요. 보통은 비워 두면 자동으로 정해져요. 터널 주소(https://….trycloudflare.com)를 쓰는데 이 화면을 localhost로 열었다면 여기에 넣어 주세요.</div>
    <input type="text" id="jurl" placeholder="${esc(joinUrl())}" value="${esc(localStorage.getItem('joinUrl') || '')}">
    <div class="row"><button class="btn" onclick="saveJoin()">주소 적용</button></div>
    <h2>초기화</h2>
    <div class="row"><button class="btn" onclick="if(confirm('모든 답을 지우고 처음으로 돌아갈까요?')) api('resetAll').then(()=>toast('답을 모두 지웠어요'))">모든 답 지우기</button>
    <button class="btn danger" onclick="if(confirm('답과 참가자 목록을 모두 지울까요? 참가자는 다시 입장해야 해요.')) api('resetAll',{players:true}).then(()=>toast('초기화했어요'))">답 + 참가자 모두 지우기</button></div>`;
  d.classList.add('open');
  refreshQList();
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
function refreshQList() {
  const ul = document.getElementById('qlist'); if (!ul) return;
  ul.innerHTML = S.questions.map((q, i) => `<li class="${i === S.cur ? 'cur' : ''}"><span class="t"><small>${i + 1}. ${TYPE_LABEL[q.type]}</small>${esc(q.title)}</span>
    ${q.answered ? `<button onclick="api('show',{i:${i}});closeDrawer()">결과(${q.answered})</button>` : ''}
    <button onclick="api('start',{i:${i}});closeDrawer()">시작</button></li>`).join('');
}
async function saveConfig() {
  await api('config', {
    questionsText: document.getElementById('qIn').value,
    rosterText: document.getElementById('rosterIn').value,
    settings: { timeChoice: document.getElementById('t1').value, timeText: document.getElementById('t2').value, autoClose: document.getElementById('auto').checked },
  });
  toast('저장했어요 ✅');
  setTimeout(openDrawer, 300);
}
function saveJoin() {
  const v = document.getElementById('jurl').value.trim();
  if (v) localStorage.setItem('joinUrl', v); else localStorage.removeItem('joinUrl');
  qrUrl = ''; render(); toast('참여 주소를 적용했어요');
}

start();
</script>
</body>
</html>
